services:
  # === Infrastructure (always runs) ===
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: june
      POSTGRES_USER: june
      POSTGRES_PASSWORD: june
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U june"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb --ignore-existing local/june-documents
      "

  # === Application (only with --profile app) ===
  api-server:
    build: ./services/api-server
    profiles: [app]
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  document-worker:
    build: ./services/document-worker
    profiles: [app]
    env_file: .env
    depends_on:
      - redis
      - minio

  extraction-worker:
    build: ./services/extraction-worker
    profiles: [app]
    env_file: .env
    depends_on:
      - redis

  sse-service:
    build: ./services/sse-service
    profiles: [app]
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - redis

  frontend:
    build: ./frontend
    profiles: [app]
    ports:
      - "3000:80"

  gateway:
    build: ./services/gateway
    profiles: [app]
    ports:
      - "80:80"
    depends_on:
      - api-server
      - sse-service
      - frontend

volumes:
  postgres_data:
  minio_data:
  redis_data:
