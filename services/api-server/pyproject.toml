[project]
name = "api-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.2",
    "psycopg[binary]>=3.3.3",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.13.1",
    "bcrypt>=5.0.0",
    "pyjwt>=2.8.0",
    "pydantic[email]>=2.12.5",
]

[project.optional-dependencies]
test = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
