[project]
name = "extraction-worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cohere>=5.20.0",
    "httpx>=0.28.1",
    "openai>=2.6.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "redis>=6.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
